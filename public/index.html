<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReyanshOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #c9d1d9;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== SVG ICONS ===== */
    .svg-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 220px;
      background: rgba(22, 27, 34, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(48, 54, 61, 0.5);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-logo {
      padding: 22px 20px 18px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.3px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-logo .logo-mark { width: 26px; height: 26px; }

    .sidebar-section {
      padding: 18px 12px 6px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: #484f58;
      font-weight: 600;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      margin: 2px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
      font-size: 0.88rem;
      color: #8b949e;
      text-decoration: none;
    }
    .nav-item:hover { background: rgba(56, 63, 70, 0.25); color: #c9d1d9; }
    .nav-item.active { background: rgba(56, 139, 253, 0.12); color: #58a6ff; font-weight: 600; }
    .nav-item .badge { margin-left: auto; background: #da3633; color: #fff; font-size: 0.68rem; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
    .nav-item.coming-soon { opacity: 0.35; cursor: not-allowed; }
    .nav-item.coming-soon:hover { background: transparent; color: #8b949e; }
    .sidebar-footer { margin-top: auto; padding: 12px; border-top: 1px solid rgba(48, 54, 61, 0.4); }
    .sidebar-footer .nav-item { font-size: 0.82rem; }

    /* ===== MAIN CONTENT ===== */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0d1117; }

    /* ===== TOP BAR ===== */
    .topbar {
      background: rgba(13, 17, 23, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #21262d;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .topbar-left h2 { font-size: 1.05rem; font-weight: 600; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
    .topbar-left .subtitle { font-size: 0.75rem; color: #484f58; margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .refresh-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: all 0.12s; display: flex; align-items: center; gap: 6px; }
    .refresh-btn:hover { background: #30363d; border-color: #8b949e; }
    .timer-text { font-size: 0.75rem; color: #484f58; }
    .timer-text span { color: #8b949e; }

    /* ===== TOOLBAR (sort + filter) ===== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 28px;
      background: rgba(13, 17, 23, 0.4);
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }
    .toolbar-left { display: flex; align-items: center; gap: 8px; }
    .toolbar-right { display: flex; align-items: center; gap: 6px; }
    .sort-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #8b949e;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
    }
    .sort-btn:hover { background: #21262d; color: #c9d1d9; }
    .sort-btn.active { background: #21262d; color: #58a6ff; border-color: #30363d; font-weight: 600; }
    .priority-filter {
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .priority-filter option { background: #161b22; color: #c9d1d9; }
    .stats-text { font-size: 0.72rem; color: #484f58; }

    /* ===== CATEGORY TABS ===== */
    .category-tabs {
      display: flex; gap: 2px; padding: 8px 28px;
      background: rgba(13, 17, 23, 0.5); border-bottom: 1px solid #21262d; flex-shrink: 0; overflow-x: auto;
    }
    .category-tab {
      padding: 7px 16px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      transition: all 0.12s; color: #8b949e; white-space: nowrap;
      display: flex; align-items: center; gap: 6px; border: 1px solid transparent;
    }
    .category-tab:hover { color: #c9d1d9; background: rgba(56, 63, 70, 0.3); }
    .category-tab.active { background: #21262d; color: #f0f6fc; font-weight: 600; border-color: #30363d; }

    /* ===== EMAIL LIST ===== */
    .content { flex: 1; overflow-y: auto; padding: 16px 28px; }

    /* ===== EMAIL CARD ===== */
    .email-card {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 0;
      margin-bottom: 6px;
      transition: border-color 0.12s, background 0.12s;
      cursor: pointer;
      overflow: hidden;
    }
    .email-card:hover { border-color: #30363d; background: #161b22; }

    .email-card-main { padding: 14px 18px 12px; }

    .email-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .email-card-left { flex: 1; min-width: 0; }

    .email-card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .from { font-weight: 600; color: #58a6ff; font-size: 0.85rem; }
    .subject { font-size: 0.93rem; margin: 3px 0; color: #e6edf3; font-weight: 500; }
    .snippet { font-size: 0.8rem; color: #8b949e; margin-top: 5px; line-height: 1.45; }
    .date { font-size: 0.7rem; color: #484f58; white-space: nowrap; }

    /* ===== PRIORITY BADGE ===== */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .priority-badge.high { background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.3); }
    .priority-badge.medium { background: rgba(174, 124, 20, 0.15); color: #d29922; border: 1px solid rgba(174, 124, 20, 0.3); }
    .priority-badge.low { background: rgba(56, 63, 70, 0.3); color: #8b949e; border: 1px solid #30363d; }
    .priority-badge.ignore { background: rgba(56, 63, 70, 0.15); color: #484f58; border: 1px solid #21262d; opacity: 0.7; }

    /* ===== PRIORITY REASON ===== */
    .priority-reason {
      font-size: 0.7rem;
      color: #484f58;
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(56, 63, 70, 0.1);
      border-radius: 4px;
      border-left: 2px solid #30363d;
    }

    /* ===== EXPANDED SECTIONS ===== */
    .email-card-expanded {
      display: none;
      border-top: 1px solid #21262d;
    }
    .email-card-expanded.visible { display: block; }

    /* ===== SUMMARY SECTION ===== */
    .summary-section {
      padding: 12px 18px;
      background: #161b22;
      border-left: 3px solid #30363d;
    }
    .summary-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 6px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .summary-text { font-size: 0.82rem; color: #8b949e; line-height: 1.5; }

    /* ===== ACTION SECTION ===== */
    .action-section {
      padding: 12px 18px;
      background: #0d1117;
    }
    .action-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #58a6ff;
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .action-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 6px;
      background: rgba(56, 139, 253, 0.04);
      border: 1px solid rgba(56, 139, 253, 0.1);
    }
    .action-item.no-action {
      background: rgba(56, 63, 70, 0.1);
      border-color: #21262d;
    }
    .action-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .action-icon.high { background: rgba(218, 54, 51, 0.15); color: #f85149; }
    .action-icon.medium { background: rgba(174, 124, 20, 0.15); color: #d29922; }
    .action-icon.low { background: rgba(56, 63, 70, 0.3); color: #8b949e; }
    .action-icon.none { background: rgba(56, 63, 70, 0.15); color: #484f58; }

    .action-content { flex: 1; }
    .action-name { font-size: 0.82rem; font-weight: 600; color: #c9d1d9; }
    .action-detail { font-size: 0.75rem; color: #8b949e; margin-top: 2px; line-height: 1.4; }
    .action-deadline {
      font-size: 0.68rem;
      color: #d29922;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* ===== STATES ===== */
    .loading, .empty, .error { text-align: center; padding: 80px 20px; color: #484f58; }
    .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid #21262d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { background: rgba(218, 54, 51, 0.08); border: 1px solid rgba(218, 54, 51, 0.3); border-radius: 8px; padding: 20px; }
    .error a { color: #58a6ff; }

    /* ===== COMING SOON ===== */
    .coming-soon-page { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #484f58; gap: 8px; }
    .coming-soon-page h3 { font-size: 1.1rem; color: #8b949e; font-weight: 500; }
    .coming-soon-page p { font-size: 0.82rem; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <svg class="logo-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="26" height="26" rx="6" fill="#21262d"/>
        <text x="13" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#58a6ff">R</text>
      </svg>
      ReyanshOS
    </div>
    <div class="sidebar-section">Platforms</div>
    <div class="nav-item active" id="nav-gmail" onclick="switchPlatform('gmail')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Gmail
      <span class="badge" id="total-badge">0</span>
    </div>
    <div class="nav-item coming-soon" id="nav-discord" onclick="switchPlatform('discord')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.434 0 13.5 13.5 0 0 0-.64-1.314.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.36-.49.679-.997.964-1.523a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.09-.065.18-.13.266-.195a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.086.065.176.13.266.195a.077.077 0 0 1-.006.127 12.9 12.9 0 0 1-1.873.892.077.077 0 0 0-.041.107c.285.526.604 1.033.964 1.523a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 5.993-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Discord
    </div>
    <div class="nav-item coming-soon" id="nav-instagram" onclick="switchPlatform('instagram')">
      <svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      Instagram
    </div>
    <div class="nav-item coming-soon" id="nav-schoology" onclick="switchPlatform('schoology')">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Schoology
    </div>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="window.location.href='/auth'">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Re-authenticate
      </div>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <h2 id="page-title">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Gmail
        </h2>
        <div class="subtitle" id="page-subtitle">Unread emails sorted by priority</div>
      </div>
      <div class="topbar-right">
        <span class="timer-text">Refresh in <span id="timer">10:00</span></span>
        <button class="refresh-btn" onclick="refresh()">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Toolbar: Sort + Filter -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <span class="stats-text" id="stats-text">Loading...</span>
      </div>
      <div class="toolbar-right">
        <button class="sort-btn active" id="sort-priority" onclick="setSort('priority')">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:13px;height:13px"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          By Priority
        </button>
        <button class="sort-btn" id="sort-time" onclick="setSort('time')">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width:13px;height:13px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          By Time
        </button>
        <select class="priority-filter" id="priority-filter" onchange="setPriorityFilter(this.value)">
          <option value="all">All Priorities</option>
          <option value="high">High Only</option>
          <option value="medium">Medium+</option>
          <option value="low">Non-Ignore</option>
        </select>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs" id="category-tabs">
      <div class="category-tab active" id="tab-primary" onclick="switchCategory('primary')">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Primary
      </div>
      <div class="category-tab" id="tab-promotions" onclick="switchCategory('promotions')">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Promotions
      </div>
      <div class="category-tab" id="tab-social" onclick="switchCategory('social')">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Social
      </div>
      <div class="category-tab" id="tab-updates" onclick="switchCategory('updates')">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Updates
      </div>
      <div class="category-tab" id="tab-forums" onclick="switchCategory('forums')">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Forums
      </div>
    </div>

    <!-- Content Area -->
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div><br>Loading emails...</div>
    </div>
  </div>

  <script>
    // ===== STATE =====
    let currentPlatform = 'gmail';
    let currentCategory = 'primary';
    let currentSort = 'priority';
    let currentPriorityFilter = 'all';
    let countdown = 600;
    let allEmails = [];
    let analyzedEmails = new Map();

    // ===== PLATFORM SWITCHING =====
    function switchPlatform(platform) {
      currentPlatform = platform;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const navEl = document.getElementById('nav-' + platform);
      if (navEl) navEl.classList.add('active');
      document.getElementById('category-tabs').style.display = platform === 'gmail' ? 'flex' : 'none';
      document.getElementById('toolbar').style.display = platform === 'gmail' ? 'flex' : 'none';
      if (platform === 'gmail') {
        document.getElementById('page-title').innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Gmail';
        document.getElementById('page-subtitle').textContent = 'Unread emails sorted by priority';
        resetTimer();
        fetchEmails();
      } else {
        renderComingSoon(platform);
      }
    }

    function renderComingSoon(platform) {
      const names = {
        discord: { title: 'Discord', desc: 'Messages, DMs, and server notifications' },
        instagram: { title: 'Instagram', desc: 'DMs, comments, likes, and story mentions' },
        schoology: { title: 'Schoology', desc: 'Assignments, grades, and course updates' },
      };
      const info = names[platform] || { title: platform, desc: '' };
      document.getElementById('page-title').textContent = info.title;
      document.getElementById('page-subtitle').textContent = info.desc;
      document.getElementById('content').innerHTML = '<div class="coming-soon-page"><h3>' + info.title + ' — Coming Soon</h3><p>This integration is under development.</p></div>';
    }

    // ===== CATEGORY SWITCHING =====
    function switchCategory(category) {
      currentCategory = category;
      analyzedEmails.clear();
      document.querySelectorAll('.category-tab').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + category).classList.add('active');
      resetTimer();
      fetchEmails();
    }

    // ===== SORT & FILTER =====
    function setSort(sort) {
      currentSort = sort;
      document.querySelectorAll('.sort-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('sort-' + sort).classList.add('active');
      renderEmails();
    }

    function setPriorityFilter(filter) {
      currentPriorityFilter = filter;
      renderEmails();
    }

    // ===== FETCH EMAILS =====
    async function fetchEmails() {
      const container = document.getElementById('content');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading emails...</div>';
      analyzedEmails.clear();

      try {
        const res = await fetch('/api/emails?category=' + currentCategory);
        if (res.status === 401) {
          container.innerHTML = '<div class="error">Not authenticated. <a href="/auth">Click here to log in with Google</a></div>';
          return;
        }
        const data = await res.json();
        allEmails = data.emails;
        document.getElementById('total-badge').textContent = data.count;

        if (data.count === 0) {
          container.innerHTML = '<div class="empty"><p>No unread emails in this category</p></div>';
          document.getElementById('stats-text').textContent = '0 emails';
          return;
        }

        // Analyze all emails in parallel
        container.innerHTML = '<div class="loading"><div class="spinner"></div><br>Analyzing priority & actions...</div>';
        const analysisPromises = allEmails.map(email => analyzeEmail(email));
        await Promise.all(analysisPromails);

        renderEmails();
      } catch (err) {
        container.innerHTML = '<div class="error">Error: ' + err.message + '</div>';
      }
    }

    async function analyzeEmail(email) {
      try {
        const [priorityRes, actionsRes] = await Promise.all([
          fetch('/api/analyze-priority/' + email.id),
          fetch('/api/extract-actions/' + email.id),
        ]);
        const priority = await priorityRes.json();
        const actions = await actionsRes.json();
        analyzedEmails.set(email.id, { priority, actions });
      } catch (err) {
        analyzedEmails.set(email.id, {
          priority: { score: 0, level: 'medium', reason: 'Analysis failed', signals: [] },
          actions: [{ action: 'No action needed', detail: 'Could not analyze email.', urgency: 'none', deadline: null }],
        });
      }
    }

    // ===== RENDER EMAILS =====
    function renderEmails() {
      const container = document.getElementById('content');
      let emails = [...allEmails];

      // Filter by priority
      if (currentPriorityFilter !== 'all') {
        emails = emails.filter(email => {
          const analysis = analyzedEmails.get(email.id);
          if (!analysis) return true;
          const level = analysis.priority.level;
          if (currentPriorityFilter === 'high') return level === 'high';
          if (currentPriorityFilter === 'medium') return level === 'high' || level === 'medium';
          if (currentPriorityFilter === 'low') return level !== 'ignore';
          return true;
        });
      }

      // Sort
      if (currentSort === 'priority') {
        const priorityOrder = { high: 0, medium: 1, low: 2, ignore: 3 };
        emails.sort((a, b) => {
          const aAnalysis = analyzedEmails.get(a.id);
          const bAnalysis = analyzedEmails.get(b.id);
          const aLevel = aAnalysis ? aAnalysis.priority.level : 'low';
          const bLevel = bAnalysis ? bAnalysis.priority.level : 'low';
          const aOrder = priorityOrder[aLevel] ?? 2;
          const bOrder = priorityOrder[bLevel] ?? 2;
          if (aOrder !== bOrder) return aOrder - bOrder;
          // Secondary: by score
          const aScore = aAnalysis ? aAnalysis.priority.score : 0;
          const bScore = bAnalysis ? bAnalysis.priority.score : 0;
          return bScore - aScore;
        });
      } else {
        emails.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      // Update stats
      const highCount = emails.filter(e => { const a = analyzedEmails.get(e.id); return a && a.priority.level === 'high'; }).length;
      const medCount = emails.filter(e => { const a = analyzedEmails.get(e.id); return a && a.priority.level === 'medium'; }).length;
      document.getElementById('stats-text').textContent = emails.length + ' emails — ' + highCount + ' high, ' + medCount + ' medium priority';

      if (emails.length === 0) {
        container.innerHTML = '<div class="empty"><p>No emails match the current filter</p></div>';
        return;
      }

      container.innerHTML = '';
      for (const email of emails) {
        const analysis = analyzedEmails.get(email.id);
        const card = createEmailCard(email, analysis);
        container.appendChild(card);
      }
    }

    function createEmailCard(email, analysis) {
      const card = document.createElement('div');
      card.className = 'email-card';
      card.id = 'card-' + email.id;

      const priority = analysis ? analysis.priority : { level: 'medium', reason: 'Analyzing...', score: 0 };
      const actions = analysis ? analysis.actions : [];
      const level = priority.level;

      // Priority badge SVG icons
      const badgeIcons = {
        high: '<svg class="svg-icon" viewBox="0 0 24 24" style="width:11px;height:11px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        medium: '<svg class="svg-icon" viewBox="0 0 24 24" style="width:11px;height:11px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        low: '<svg class="svg-icon" viewBox="0 0 24 24" style="width:11px;height:11px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        ignore: '<svg class="svg-icon" viewBox="0 0 24 24" style="width:11px;height:11px"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
      };

      const actionItemsHtml = actions.map(action => {
        const urgencyClass = action.urgency || 'none';
        const isNoAction = action.action === 'No action needed';
        return '<div class="action-item' + (isNoAction ? ' no-action' : '') + '">' +
          '<div class="action-icon ' + urgencyClass + '">' + action.action.charAt(0) + '</div>' +
          '<div class="action-content">' +
            '<div class="action-name">' + escapeHtml(action.action) + '</div>' +
            '<div class="action-detail">' + escapeHtml(action.detail) + '</div>' +
            (action.deadline ? '<div class="action-deadline"><svg class="svg-icon" viewBox="0 0 24 24" style="width:10px;height:10px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + escapeHtml(action.deadline) + '</div>' : '') +
          '</div></div>';
      }).join('');

      card.innerHTML =
        '<div class="email-card-main">' +
          '<div class="email-card-top">' +
            '<div class="email-card-left">' +
              '<div class="from">' + escapeHtml(email.from) + '</div>' +
              '<div class="subject">' + escapeHtml(email.subject) + '</div>' +
              '<div class="snippet">' + escapeHtml(email.snippet) + '</div>' +
              '<div class="priority-reason">' + escapeHtml(priority.reason) + '</div>' +
            '</div>' +
            '<div class="email-card-right">' +
              '<span class="date">' + formatDate(email.date) + '</span>' +
              '<span class="priority-badge ' + level + '">' + (badgeIcons[level] || '') + ' ' + level + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="email-card-expanded" id="expanded-' + email.id + '">' +
          '<div class="summary-section">' +
            '<div class="summary-label"><svg class="svg-icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Summary</div>' +
            '<div class="summary-text" id="summary-text-' + email.id + '">Loading...</div>' +
          '</div>' +
          '<div class="action-section">' +
            '<div class="action-label"><svg class="svg-icon" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Actions</div>' +
            '<div id="actions-' + email.id + '"><div class="action-item no-action"><div class="action-icon none">—</div><div class="action-content"><div class="action-detail">Analyzing actions...</div></div></div></div>' +
          '</div>' +
        '</div>';

      card.onclick = (e) => toggleCard(email.id);
      return card;
    }

    // ===== TOGGLE CARD EXPANSION =====
    async function toggleCard(emailId) {
      const expanded = document.getElementById('expanded-' + emailId);
      const isVisible = expanded.classList.contains('visible');
      expanded.classList.toggle('visible');
      if (isVisible) return;

      // Load summary
      const summaryText = document.getElementById('summary-text-' + emailId);
      summaryText.textContent = 'Loading...';
      try {
        const res = await fetch('/api/email/' + emailId);
        const data = await res.json();
        summaryText.textContent = generateSummary(data);
      } catch (err) {
        summaryText.textContent = 'Failed to load email body.';
      }

      // Load actions if not already loaded
      const actionsContainer = document.getElementById('actions-' + emailId);
      const analysis = analyzedEmails.get(emailId);
      if (analysis && analysis.actions) {
        const actionItemsHtml = analysis.actions.map(action => {
          const urgencyClass = action.urgency || 'none';
          const isNoAction = action.action === 'No action needed';
          return '<div class="action-item' + (isNoAction ? ' no-action' : '') + '">' +
            '<div class="action-icon ' + urgencyClass + '">' + action.action.charAt(0) + '</div>' +
            '<div class="action-content">' +
              '<div class="action-name">' + escapeHtml(action.action) + '</div>' +
              '<div class="action-detail">' + escapeHtml(action.detail) + '</div>' +
              (action.deadline ? '<div class="action-deadline"><svg class="svg-icon" viewBox="0 0 24 24" style="width:10px;height:10px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + escapeHtml(action.deadline) + '</div>' : '') +
            '</div></div>';
        }).join('');
        actionsContainer.innerHTML = actionItemsHtml;
      }
    }

    // ===== EXTRACTIVE SUMMARY =====
    function generateSummary(email) {
      const text = (email.body || email.snippet || '').replace(/\s+/g, ' ').trim();
      if (!text) return 'No content to summarize.';
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const meaningful = sentences.filter(s => s.trim().length > 20);
      const summary = meaningful.slice(0, 3).join(' ').trim();
      return summary || text.substring(0, 300);
    }

    // ===== REFRESH =====
    function refresh() { resetTimer(); fetchEmails(); }

    // ===== TIMER =====
    function resetTimer() { countdown = 600; updateTimerDisplay(); }
    function updateTimerDisplay() {
      const m = Math.floor(countdown / 60);
      const s = countdown % 60;
      document.getElementById('timer').textContent = m + ':' + s.toString().padStart(2, '0');
    }
    function startTimer() {
      setInterval(() => {
        countdown--;
        updateTimerDisplay();
        if (countdown <= 0) { if (currentPlatform === 'gmail') fetchEmails(); resetTimer(); }
      }, 1000);
    }

    // ===== UTILS =====
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try { return new Date(dateStr).toLocaleString(); }
      catch { return dateStr; }
    }

    // ===== INIT =====
    fetchEmails();
    startTimer();
  </script>
</body>
</html>
